<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee Directory | Atlas HR</title>
  <link rel="stylesheet" href="css/employees.css">
</head>
<body>

  <!-- overall page layout: sidebar on the left, main content on the right -->
  <div class="directory-layout">

    <!-- left navigation sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <img src="assets/images/logo-light.svg" alt="Atlas HR logo">
      </div>

      <nav class="sidebar-nav">
        <a href="../Task-3-Bharath/dashboard.html" class="nav-link">Dashboard</a>
        <a href="../Task-13-Bharath/hr-dashboard.html" class="nav-link">HR Dashboard</a>
        <a href="employees.html" class="nav-link active">Employee Directory</a>
        <a href="../Task-6-Bharath/employee-management.html" class="nav-link">Employee Management</a>
        <a href="../Task-14-Bharath/employee-profile.html" class="nav-link">Employee Profile</a>
        <a href="../Task-10-Bharath/attendance.html" class="nav-link">Attendance</a>
        <a href="../Task-11-Bharath/leave-management.html" class="nav-link">Leave Request</a>
        <a href="../Task-12-Bharath/leave-approval.html" class="nav-link">Leave Approval</a>
        <a href="../Task-3-Bharath/pages/payroll.html" class="nav-link">Payroll</a>
        <a href="../Task-3-Bharath/pages/crm.html" class="nav-link">CRM</a>
        <a href="../Task-3-Bharath/pages/finance.html" class="nav-link">Finance</a>
      </nav>
    </aside>

    <!-- everything to the right of the sidebar -->
    <div class="main-area">

      <!-- top header bar with the mobile menu button and page title -->
      <header class="topbar">
        <button id="sidebarToggle" class="sidebar-toggle" aria-label="Toggle sidebar">☰</button>
        <h1>Employee Directory</h1>
      </header>

      <main class="directory-content">

        <!-- search box and department dropdown sit side by side -->
        <div class="controls-row">
          <input type="text" id="searchInput" placeholder="Search by name...">

          <select id="departmentFilter">
            <option value="all">All Departments</option>
            <option value="HR">HR</option>
            <option value="CRM">CRM</option>
            <option value="Finance">Finance</option>
            <option value="Development">Development</option>
          </select>
        </div>

        <!-- shows how many employees match the current search/filter -->
        <p id="resultCount" class="result-count"></p>

        <!-- empty on page load - employees.js fills this with one card per employee -->
        <div class="employee-grid" id="employeeGrid">
          <!-- employee cards are rendered here by js/employees.js -->
        </div>

        <!-- shown instead of the grid when no employee matches the search/filter -->
        <p id="noResults" class="no-results" hidden>No employees match your search.</p>

      </main>

    </div>

  </div>

  <script src="js/employees.js"></script>
</body>
</html>
